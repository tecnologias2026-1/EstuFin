<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a EstuFin</title>
    <link rel="stylesheet" href="css/style.css"> 
    <link rel="stylesheet" href="css/bienvenida.css">
</head>
<body>
    <main class="welcome-container">
        <h1>¡Bienvenido! 👋</h1>
        <p>Antes de comenzar, configura tus métodos de pago</p>

        <div class="info-box">
            💡 Necesitas al menos un método de pago para registrar gastos
        </div>

        <button id="btn-add-method" class="btn-primary">+ Añadir método de pago</button>

        <div id="methods-list" class="methods-container">
            <div class="empty-state">
                <img src="assets/wallet-icon.png" alt="Wallet" class="welcome-icon">
                <p>No has agregado ningún método de pago</p>
            </div>
        </div>

        <button id="btn-continue" class="btn-secondary" disabled onclick="window.location.href='dashboard.html'">
            Agrega al menos un método para continuar
        </button>
    </main>

    <div id="modal-method" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>Nuevo método de pago</h2>
            <form id="form-method">
                <label>Tipo de método</label>
                <select id="method-type" required>
                    <option value="choose">Elige una Opción</option>
                    <option value="efectivo">Efectivo</option>
                    <option value="tarjeta_deb">Tarjeta Débito</option>
                    <option value="tarjeta_cre">Tarjeta Crédito</option>
                    <option value="bancario">Cuenta Bancaria</option>
                </select>
                <label>Nombre del método</label>
                <input type="text" id="method-name" placeholder="Ej: Efectivo, Bancolombia" required>
                <div id="bank-name-group" class="hidden">
                    <label>Nombre del banco</label>
                    <input type="text" id="method-bank" placeholder="Ej: Bancolombia, Davivienda">
                </div>
                <label>Saldo inicial</label>
                <input type="number" id="method-balance" value="0" step="0.01" required>
                <div class="modal-actions">
                    <button type="button" id="btn-cancel" class="btn-cancel">Cancelar</button>
                    <button type="submit" id="btn-save" class="btn-save">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/setup-saldos.js"></script>
</body>
</html>
