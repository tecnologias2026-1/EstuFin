<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstuFin - Bienvenida</title>
    <link rel="stylesheet" href="css/bienvenida.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="welcome-container">

        <div class="logo-area">
            <div class="logo-icon">$</div>
            <h1>¡Bienvenido a EstuFin!</h1>
            <p>Agrega tus métodos de pago para comenzar a controlar tus finanzas.</p>
        </div>

        <div class="info-box">
            💡 Puedes agregar efectivo, cuentas bancarias o billeteras digitales.
        </div>

        <form id="paymentForm">
            <label for="paymentName">¿Dónde tienes tu dinero?</label>
            <input type="text" id="paymentName" placeholder="Ej: Nequi, Daviplata, Efectivo" required>

            <label for="paymentAmount">¿Cuánto dinero hay ahí? (COP)</label>
            <input type="number" id="paymentAmount" placeholder="0" min="0" required>

            <button type="submit" class="btn-primary" style="margin-top: 16px;">
                + Agregar método
            </button>
        </form>

        <div class="methods-container" id="methodsContainer">
            <p style="text-align:center; color:#A0AEC0; margin: auto;">
                Aún no has agregado ningún método.
            </p>
        </div>

        <div id="totalDisplay" class="hidden" style="text-align:center; margin: 12px 0; font-weight:600; color: #1A56FF; font-size:15px;">
            Total: $<span id="totalAmount">0</span> COP
        </div>

        <button id="goToDashboardBtn" class="btn-secondary" disabled>
            Finalizar y ver Dashboard →
        </button>

        <a href="login.html" style="display:block; text-align:center; margin-top:16px; color:#718096; font-size:14px; text-decoration:none;">
            ← Volver al login
        </a>
    </div>

    <script src="js/bienvenida.js"></script>
</body>
</html>
