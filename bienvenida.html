<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstuFin - Bienvenida</title>
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .payment-methods-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .payment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .payment-info {
            display: flex;
            gap: 15px;
            align-items: baseline;
        }
        .payment-name {
            font-weight: 600;
        }
        .payment-amount {
            color: #2e7d32;
        }
        .delete-payment {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: #d32f2f;
        }
        .btn-secondary {
            background: #6c757d;
            margin-top: 15px;
        }
        .error-message {
            color: red;
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body class="landing-container">
    <div class="auth-card" style="max-width: 500px;">
        <div class="logo-area-small">
            <div class="logo-icon-placeholder-small"><span>$</span></div>
            <h2>¡Bienvenido a EstuFin!</h2>
            <p>Antes de empezar, agrega tus métodos de pago (Nequi, Daviplata, efectivo, etc.)</p>
        </div>

        <form id="paymentForm" class="auth-form">
            <h3>Agregar método de pago</h3>
            <div class="input-group">
                <label for="paymentName">Nombre del método</label>
                <input type="text" id="paymentName" placeholder="Ej: Nequi, Daviplata, Efectivo" required>
            </div>
            <div class="input-group">
                <label for="paymentAmount">Monto disponible (COP)</label>
                <input type="number" id="paymentAmount" placeholder="Ej: 50000" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Agregar método</button>
        </form>

        <div class="payment-methods-list" id="paymentMethodsList">
            <h4>Métodos agregados:</h4>
            <div id="methodsContainer">
                <!-- Aquí se listarán dinámicamente -->
            </div>
        </div>

        <button id="goToDashboardBtn" class="btn btn-primary btn-full" style="background-color: #2e7d32; margin-top: 20px;">Continuar al Dashboard</button>
        <a href="login.html" class="btn-back" style="display: block; text-align: center; margin-top: 15px;">← Cerrar sesión</a>
    </div>

    <script src="js/bienvenida.js"></script>
</body>
</html>
