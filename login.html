<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstuFin - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="landing-container">
    <div class="auth-card">
        <div class="logo-area-small">
            <div class="logo-icon-placeholder-small"><span>$</span></div>
            <h2>EstuFin</h2>
            <p>Bienvenido de nuevo.</p>
        </div>

        <form class="auth-form" id="loginForm">
            <h3>Iniciar sesión</h3>
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="usuario@correo.com" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="********" required>
                    <span class="toggle-password" id="togglePass">👁️</span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Entrar</button>

            <p class="auth-footer">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            <a href="index.html" class="btn-back">← Volver al inicio</a>
        </form>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/header.js"></script>
</body>
</html>
