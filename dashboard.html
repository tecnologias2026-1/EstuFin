<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstuFin - Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<button class="mobile-menu-btn" id="sidebarToggle">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon">$</div>
            <div class="logo-text">
                <h1>EstuFin</h1>
                <p>Finanzas para Estudiantes</p>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item active"><span>🏠</span> Inicio</a>
            <a href="#" class="nav-item"><span>📈</span> Gastos e Ingresos</a>
            <a href="#" class="nav-item"><span>➕</span> Registrar Movimiento</a>
            <a href="#" class="nav-item"><span>💰</span> Gastos Fijos</a>
            <a href="#" class="nav-item"><span>🎯</span> Mis Metas</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-header">
            <h2 class="page-title">Mi Resumen</h2>
            <div class="user-info">
                <span class="user-name">Usuario</span>
                <div class="avatar">👤</div>
            </div>
        </header>

        <!-- CAJA DE SALDO AZUL (PUNTO CENTRAL) -->
        <section class="balance-highlight">
            <div class="balance-card-blue">
                <p class="balance-label">Saldo Total Disponible</p>
                <h2 class="balance-amount" id="totalBalance">$ 0</h2>
                <span class="balance-currency">Pesos Colombianos (COP)</span>
            </div>
        </section>

        <!-- MÉTODOS DE PAGO -->
        <section class="methods-section">
            <div class="section-header">
                <h3>💰 Mis Métodos de Pago</h3>
            </div>
            
            <div class="methods-grid" id="methodsList">
                <!-- Se genera dinámicamente -->
            </div>

            <button class="btn-add-method" id="openAddMethodModal">
                + Agregar nuevo método
            </button>
        </section>
    </main>
</div>

<!-- Modal para agregar -->
<div class="modal-overlay hidden" id="addMethodModal">
    <div class="modal-box">
        <h3>Nuevo Método de Pago</h3>
        <form id="modalPaymentForm">
            <div class="input-group">
                <label>Nombre del método</label>
                <input type="text" id="modalMethodName" placeholder="Ej. Nequi, Efectivo" required>
            </div>
            <div class="input-group">
                <label>Saldo inicial</label>
                <input type="number" id="modalMethodAmount" placeholder="0" required>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="closeModal">Cancelar</button>
                <button type="submit" class="btn-save">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
